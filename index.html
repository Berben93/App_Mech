<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tabellenbuch</title>
  <meta name="description" content="Tabellenbuch für die Zerspanung: Passungen, Toleranzen, Gewinde, Schnittwerte, Drehmomente, Rauheit, Gewicht und Einheiten. Offline, ohne Werbung, ohne Konto.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Theme vor dem ersten Zeichnen setzen, damit der Dunkelmodus nicht aufblitzt
    try {
      var s = JSON.parse(localStorage.getItem('wtb:settings') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header id="app-header" class="app-header">
    <div class="bar">
      <button id="back" class="icon-btn" type="button" aria-label="Zur Startseite" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="title">Tabellenbuch</h1>
      <span id="offline" class="offline" hidden>offline</span>
      <button id="theme" class="icon-btn" type="button" aria-label="Design umschalten">
        <svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
        <svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
    <form id="search-form" class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="search" type="search" placeholder="Suchen: M12, 25 H7/g6, Ra 1,6 …" autocomplete="off" enterkeyhint="search" aria-label="Suche">
    </form>
  </header>
  <main id="view" class="view"></main>
  <noscript><p class="empty">Diese App braucht JavaScript.</p></noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
